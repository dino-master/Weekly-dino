
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>길드 소식 - 메인 페이지</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            transition: background 0.3s, color 0.3s;
        }

        /* ✅ 다크모드 스타일 */
        .dark-mode {
            background-color: #1e1e1e;
            color: #f4f4f4;
        }

        /* ✅ 전체 컨테이너 */
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        /* ✅ 헤더 스타일 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 2px solid #ddd;
        }

        .guild-info {
            display: flex;
            align-items: center;
        }

        .guild-icon {
            width: 50px;
            height: 50px;
            margin-right: 15px;
        }

        .guild-name {
            font-size: 24px;
            font-weight: bold;
        }

        /* ✅ 다크모드 토글 버튼 */
        .toggle-container {
            display: flex;
            align-items: center;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 25px;
            background: #ddd;
            border-radius: 50px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch::before {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            top: 2.5px;
            left: 3px;
            transition: transform 0.3s ease-in-out;
        }

        /* ✅ 다크모드일 때 버튼 이동 (고정) */
        .dark-mode .toggle-switch {
            background: #555;
        }

        .dark-mode .toggle-switch::before {
            transform: translateX(25px);
        }

        /* ✅ 다크모드 토글 아이콘 */
        .theme-icon {
            width: 30px;
            height: 30px;
            transition: filter 0.3s ease-in-out;
            margin: 0 10px;
        }

        .dark-mode .theme-icon {
            filter: invert(1) brightness(100%);
        }

        /* ✅ 사이드바 스타일 */
        .sidebar {
            width: 250px;
            padding: 20px;
            border-right: 2px solid #ddd;
        }

        .sidebar a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: inherit;
            transition: background 0.2s;
        }

        .sidebar a:hover {
            background: #ddd;
        }

        .dark-mode .sidebar a:hover {
            background: #444;
        }

        /* ✅ 메인 콘텐츠 스타일 */
        .content {
            flex-grow: 1;
            padding: 20px;
        }

        .latest-news {
            background: #eee;
            padding: 20px;
            border-radius: 10px;
        }

        .dark-mode .latest-news {
            background: #333;
        }

        /* ✅ 푸터 스타일 */
        .footer {
            text-align: center;
            padding: 10px;
            margin-top: 20px;
            border-top: 2px solid #ddd;
        }

        .dark-mode .footer {
            border-top: 2px solid #444;
        }

        /* ✅ 레이아웃 스타일 */
        .main-layout {
            display: flex;
        }

    </style>
</head>
<body>

    <!-- ✅ 헤더 -->
    <header class="header">
        <div class="guild-info">
            <img src="assets/guild-icon.svg" alt="길드 아이콘" class="guild-icon">
            <div class="guild-name">길드명: <span>최강 전사단</span></div>
        </div>

        <!-- ✅ 다크모드 토글 -->
        <div class="toggle-container">
            <img id="light-icon" class="theme-icon" src="assets/light mode.svg" alt="Light Mode Icon">
            <div id="toggle-btn" class="toggle-switch" onclick="toggleDarkMode()"></div>
            <img id="dark-icon" class="theme-icon" src="assets/dark mode.svg" alt="Dark Mode Icon">
        </div>
    </header>

    <!-- ✅ 메인 레이아웃 -->
    <div class="container">
        <div class="main-layout">
            
            <!-- ✅ 사이드바 -->
            <aside class="sidebar">
                <a href="#">🏠 길드 소식지</a>
                <a href="#">👥 길드원 정보</a>
                <a href="#">📩 문의 페이지</a>
            </aside>

            <!-- ✅ 메인 콘텐츠 -->
            <main class="content">
                <h2>길드 최신 소식</h2>
                <div class="latest-news">
                    <p>✨ 이번 주 최고의 전투 결과! 길드원들의 전투 기록을 확인하세요.</p>
                    <p>🏆 길드 랭킹 1위 유지! 보상 및 혜택 안내</p>
                    <p>📅 다음 길드 이벤트 일정: 3월 15일 오후 8시</p>
                </div>
            </main>
        </div>
    </div>

    <!-- ✅ 푸터 -->
    <footer class="footer">
        <p>© 2025 길드 소식지. All rights reserved.</p>
    </footer>

    <!-- ✅ JavaScript (토글 기능) -->
    <script>
        function toggleDarkMode() {
            const body = document.body;
            
            // 다크모드 상태 변경
            body.classList.toggle("dark-mode");

            // 상태 저장 (로컬스토리지)
            if (body.classList.contains("dark-mode")) {
                localStorage.setItem("theme", "dark");
            } else {
                localStorage.setItem("theme", "light");
            }
        }

        // 페이지 로드 시 저장된 테마 적용 (토글 버튼 위치 고정)
        window.onload = function () {
            const savedTheme = localStorage.getItem("theme");

            if (savedTheme === "dark") {
                document.body.classList.add("dark-mode");
            }
        };
    </script>

</body>
</html>
